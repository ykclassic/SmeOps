name: CI

on:
  push:
    branches: ["main", "phase-1/**", "phase-2/**", "phase-3/**", "phase-4/**", "phase-5/**"]
  pull_request:
    branches: ["main", "phase-1/**", "phase-2/**", "phase-3/**", "phase-4/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smeops
          POSTGRES_USER: smeops
          POSTGRES_PASSWORD: smeops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smeops -d smeops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-only-secret-that-is-long-enough-for-jwt-signing
      DATABASE_URL: postgresql+asyncpg://smeops:smeops@localhost:5432/smeops
      WHATSAPP_VERIFY_TOKEN: test-verify-token
      WHATSAPP_APP_SECRET: test-whatsapp-app-secret
      WHATSAPP_TOKEN_ENCRYPTION_KEY: c21lb3BzLWNpLXdoYXRzYXBwLWZlcm5ldC1rZXktMzI=
      PLATFORM_ADMIN_KEY: test-platform-admin-key-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate database migrations
        run: alembic upgrade head
      - name: Check migration metadata drift
        run: alembic check
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
