name: Bootstrap frontend lockfile

on:
  push:
    branches:
      - security/nextjs-react-patch
    paths:
      - "frontend/package.json"
      - ".github/workflows/bootstrap-frontend-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: security/nextjs-react-patch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify resolved framework versions
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            next: '15.5.28',
            react: '19.1.10',
            'react-dom': '19.1.10',
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = lock.packages?.['node_modules/' + name]?.version;
            if (actual !== version) {
              throw new Error(name + ': expected ' + version + ', got ' + actual);
            }
            console.log(name + '@' + actual);
          }
          NODE

      - name: Commit generated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "build(frontend): commit npm lockfile"
            git push origin HEAD:security/nextjs-react-patch
          fi

      - name: Install from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
