name: Live acceptance tests

on:
  workflow_dispatch:
    inputs:
      verify_customer_booking:
        description: Verify a completed real WhatsApp customer booking
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smeops-live-acceptance
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_DASHBOARD_URL: ${{ vars.E2E_DASHBOARD_URL }}
      E2E_TEST_TENANT_SLUG: ${{ secrets.E2E_TEST_TENANT_SLUG }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_CUSTOMER_PHONE: ${{ secrets.E2E_CUSTOMER_PHONE }}
      E2E_EXPECTED_SERVICE_NAME: ${{ vars.E2E_EXPECTED_SERVICE_NAME }}
      E2E_VERIFY_CUSTOMER_BOOKING: ${{ inputs.verify_customer_booking }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate dashboard test configuration
        run: |
          test -n "$E2E_DASHBOARD_URL"
          test -n "$E2E_TEST_TENANT_SLUG"
          test -n "$E2E_TEST_EMAIL"
          test -n "$E2E_TEST_PASSWORD"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run owner dashboard acceptance test
        run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_TEST_TENANT_SLUG: ${{ secrets.E2E_TEST_TENANT_SLUG }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_VERIFY_CUSTOMER_BOOKING: ${{ inputs.verify_customer_booking }}
      E2E_CUSTOMER_PHONE: ${{ secrets.E2E_CUSTOMER_PHONE }}
      E2E_EXPECTED_SERVICE_NAME: ${{ vars.E2E_EXPECTED_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e .
      - name: Validate API test configuration
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_TEST_TENANT_SLUG"
          test -n "$E2E_TEST_EMAIL"
          test -n "$E2E_TEST_PASSWORD"
          if [ "$E2E_VERIFY_CUSTOMER_BOOKING" = "true" ]; then
            test -n "$E2E_CUSTOMER_PHONE"
            test -n "$E2E_EXPECTED_SERVICE_NAME"
          fi
      - name: Run live API and booking acceptance checks
        run: python scripts/e2e_acceptance.py
