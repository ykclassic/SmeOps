name: Generate frontend lockfile

on:
  push:
    branches:
      - security/nextjs-react-patch

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-react-patch
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Require valid lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Switch CI to deterministic install
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/ci.yml")
          s = p.read_text()
          old = "run: npm install --no-audit --no-fund"
          new = "run: npm ci --no-audit --no-fund"
          if old in s:
              p.write_text(s.replace(old, new))
          elif new not in s:
              raise SystemExit("Expected frontend install command not found")
          PY
      - name: Commit lockfile and CI change
        run: |
          if git diff --quiet -- frontend/package-lock.json .github/workflows/ci.yml; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/ci.yml
          git commit -m "chore(frontend): commit npm lockfile and use npm ci"
          git push origin HEAD:security/nextjs-react-patch
