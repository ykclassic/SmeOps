name: Generate frontend npm lockfile

on:
  push:
    branches:
      - security/nextjs-react-patch

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-react-patch
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): add npm lockfile"
          git push origin HEAD:security/nextjs-react-patch
