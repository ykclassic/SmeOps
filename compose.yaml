services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smeops
      POSTGRES_USER: smeops
      POSTGRES_PASSWORD: smeops
    ports:
      - "5432:5432"
    volumes:
      - smeops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smeops -d smeops"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  smeops_postgres_data:
