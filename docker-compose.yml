services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smeops}
      POSTGRES_USER: ${POSTGRES_USER:-smeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smeops}
    ports:
      - "5432:5432"
    volumes:
      - smeops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smeops} -d ${POSTGRES_DB:-smeops}"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    environment: &app-environment
      APP_ENV: ${APP_ENV:-local}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-only-insecure-secret-change-before-deployment}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://smeops:smeops@db:5432/smeops}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_ISSUER: ${JWT_ISSUER:-smeops-api}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_TOKEN_ENCRYPTION_KEY:-}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build: .
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

volumes:
  smeops-postgres:
